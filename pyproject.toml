[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dqd-autotuning"
version = "0.1.0"
description = "Automated calibration of a carbon-nanotube double quantum dot: interdot detection and contrast optimisation on the C12 simulator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
]

[dependency-groups]
# Tooling for contributors to this repo. `uv sync` installs this automatically;
# skip it with `uv sync --no-dev`.
dev = [
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["csd", "stage1_linefilter", "stage2_optimizer"]

[tool.ruff]
line-length = 100
